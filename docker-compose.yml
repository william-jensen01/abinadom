services:
  mcp-server:
    image: h5wyxaa9vrvo/lds-mcp:latest
    env_file:
      - .env
    environment:
      # The image holds code only. Every SQLite file the server reads is mounted
      # read-only from the host (paths below are relative to this file).
      SCRIPTURE_DB_PATH: /data/scripture.db
      SCI_DB_VERSION: ${SCI_DB_VERSION:-55}
      # Weaviate is reached by its compose service name, on its in-network port.
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: "8080"
    volumes:
      - ./db/scripture.db:/data/scripture.db:ro
      # core/content are mounted as single files: a directory mounted over
      # /app/db would hide the db package baked into the image.
      - ./db/core.${SCI_DB_VERSION:-55}.db:/app/db/core.${SCI_DB_VERSION:-55}.db:ro
      - ./db/content.${SCI_DB_VERSION:-55}.db:/app/db/content.${SCI_DB_VERSION:-55}.db:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7363/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      weaviate:
        condition: service_healthy

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.1
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "weaviate-node"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s

networks:
  proxy:
    external: true
    name: proxy

volumes:
  weaviate_data:
