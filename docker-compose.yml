services:
  mcp-server:
    build: .
    env_file:
      - .env
    volumes:
      - ${CHROMADB_DATA_PATH}:/data/chromadb
      - ${AUTH_DATA_PATH}:/data/auth.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
